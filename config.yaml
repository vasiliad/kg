# Autonomous Sovereign Multi-Tier AI Complex
project:
  name: sovereign-ai-complex
  version: 2.0.0
  architecture: dual-tier-sovereign-nim

local_arbiter:
  model_id: Qwen/Qwen2.5-1.5B-Instruct
  backup_ultra_light_id: Qwen/Qwen2.5-0.5B-Instruct
  inference_engine: transformers_cpu
  fallback_to_deterministic_kernel: true
  context_window: 8192
  max_memory_gb: 4.0
  temperature: 0.6
  top_p: 0.9

tactical_nim:
  base_url: https://integrate.api.nvidia.com/v1
  default_executor: minimaxai/minimax-m3.1-flash
  context_window: 262144
  max_output_tokens: 131072
  rate_limit_rpm: 30
  benchmark_min_score: 80.0
  # SEED ONLY: the starting point the tuner verifies first. The duty roster
  # itself is chosen by live measurement (harness/fleet_tuner.py), not here.
  target_model_keywords:
    - minimaxai/minimax-m3.1-flash
    - z-ai/glm-5.3-flash
    - deepseek-ai/deepseek-v4.1-flash
    - nvidia/nemotron-3-ultra-550b-a55b
    - stepfun-ai/step-5-preview

fleet_tuner:
  # Autonomous duty-team selection policy. Model ids are NOT listed here on
  # purpose: the tuner discovers them in the live catalogue and measures them
  # (math / code / JSON probes + latency + parameter sweep). These knobs cap
  # the probe budget and define the approval thresholds.
  max_candidates: 14        # pinged each cycle (30 RPM budget)
  quality_candidates: 6     # get the full objective probe set
  min_score: 55.0           # below this a model is not duty-eligible
  min_params_b: 150.0       # hard floor: models under 150B never enter the pool
  fast_latency_cap_sec: 12.0
  max_fleet_size: 5
  param_sweep: true         # sampling parameters chosen by measurement

memory_engine:
  enabled: true
  model: nvidia/nemotron-3.5-embed-8b
  backup_model: nvidia/nemotron-3.5-embed-1b
  master_log_file: data/telegram_history.txt
  vault_file: data/.memory_vault.json
  max_working_memory_turns: 5

telegram_bot:
  enabled: true
  polling_timeout_sec: 30
  default_executor: minimaxai/minimax-m3.1-flash
  enable_keenable_search: true
  allowed_user_ids: []

github_state:
  branch: main
  history_file: nim_history.log
  state_file: active_models.json
