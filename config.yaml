emergency_fallback:
  cpu_arbiter_surrogate: minimaxai/minimax-m3.1-flash
  cron_schedule: 0 */6 * * *
  enabled: true
  kaggle_kernel: vasiliadi911/deepseek-r1-tpu-nim-orchestrator
  mode: cpu_orchestrator
  timeout_hours_before_fallback: 6
github_state:
  branch: main
  history_file: nim_history.log
  repo: ''
  state_file: active_models.json
nvidia_nim:
  base_url: https://integrate.api.nvidia.com/v1
  benchmark_min_score: 80.0
  catalog_api_url: https://api.ngc.nvidia.com/v2/org/nvidia/team/nim
  default_timeout_sec: 30
  rotation_alert_threshold_failures: 2
  target_model_keywords:
  - minimax/minimax-m3.1-flash
  - zhipu/glm-5.3-flash
  - deepseek-ai/deepseek-v4.1-flash
  - nvidia/550b-ultra
  - stepfun/step-5-preview
project:
  name: deepseek-tpu-nim-harness
  version: 1.0.0
quota_guard:
  max_session_minutes: 25
  target_runs_per_week: 7
  weekly_tpu_hours_limit: 20
tpu:
  backend: jax
  max_sequence_length: 4096
  memory_fraction: 0.95
  model_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
  tensor_parallel_dims: 8
zero_api_sovereign_mode:
  cpu_slm_model_id: Qwen/Qwen2.5-1.5B-Instruct
  enabled: true
  inference_engine: transformers_cpu
  max_memory_gb: 4.0
  quantization: int8
  target_platform: github_actions_cpu
  trigger_on_total_api_blackout: true
