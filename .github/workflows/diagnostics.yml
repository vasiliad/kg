name: Cloud Self-Diagnostics

# Probes every external dependency from inside the cloud runtime and writes
# the verdict into the repository, so the complex can prove (or disprove) its
# own health without a human looking at a dashboard.

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours, offset by 12 minutes to avoid the heartbeat slot.
    - cron: '12 */6 * * *'

permissions:
  contents: write
  # Required so the cycle supervisor can dispatch this workflow when the
  # scheduler skips its slot (the provider probes, dispatched by the cycle supervisor).
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # The supervisor may dispatch this while its own cron slot fires: a
    # queue, not a race — the probes are the same either way.
    concurrency:
      group: diagnostics
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # Pinned contract (requirements-actions.txt): the runtime changes
          # only when a commit changes it, not when a supplier releases.
          pip install -r requirements-actions.txt

      - name: Probe External Dependencies
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TINYFISH_API_KEYS: ${{ secrets.TINYFISH_API_KEYS }}
          LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_PASSWORD: ${{ secrets.TELEGRAM_BOT_PASSWORD }}
          REDACTION_SALT: ${{ secrets.REDACTION_SALT }}
          # The vault's salt. Measured 2026-11-05: REDACTION_SALT does NOT
          # open the vault — only VAULT_SALT does. Without this secret the
          # diagnostics cycle cannot tell a sealed mailbox from an unsealed
          # one, and the health letter would have to say «не измерено»
          # forever. The salt is never printed, only used to open entries.
          VAULT_SALT: ${{ secrets.VAULT_SALT }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # The backup account and the archive copy — wired here too
          # (audited 2026-11-04: the code had them, no workflow passed them,
          # so the failover and the archive could never activate).
          GMAIL_SENDER_2: ${{ secrets.GMAIL_SENDER_2 }}
          GMAIL_APP_PASSWORD_2: ${{ secrets.GMAIL_APP_PASSWORD_2 }}
          ARCHIVE_RECIPIENT_EMAIL: ${{ secrets.ARCHIVE_RECIPIENT_EMAIL }}
          DISPATCH_RECIPIENT_EMAIL: ${{ secrets.DISPATCH_RECIPIENT_EMAIL }}
        # NOT `|| true` (audited 2026-11-04): diagnostics.py answers 1 when a
        # critical provider is dead, and the workflow threw that answer away —
        # the run stayed GREEN while NVIDIA or Telegram was down. The module
        # writes its report BEFORE it returns, so the evidence is not lost.
        run: python harness/diagnostics.py

      - name: Publish Diagnostics Report
        # `if: always()` — the report must reach the repository even when
        # the verdict is red. A red run that publishes nothing leaves the
        # supervisor with a stale artefact and the operator with no evidence.
        if: always()
        run: |
          git config --global user.name "vasiliad"
          git config --global user.email "vasiliadi@users.noreply.github.com"
          git add diagnostics_report.json || true
          # The credential heartbeat: the decay record of every probed
          # credential. Audited 2026-11-04: it was written by two cycles and
          # committed by neither, so the history of the decay died with the
          # runner — the operator only ever saw the last verdict.
          git add data/.credential_heartbeat.json || true
          # The mailbox inventory. The dispatch job cannot measure it (it
          # carries only REDACTION_SALT, which does not open the vault), so
          # the cycle that CAN measure it publishes the numbers here and the
          # letter reads this artefact instead of guessing. The artefact
          # holds COUNTS and tiers — never an address, never a password.
          git add data/.mailbox_tiers.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(diagnostics): cloud dependency health report [skip ci]"
            echo "Diagnostics report committed."
          else
            echo "No dependency changes detected."
          fi

          # Shared helper: rebases and retries, because the bot daemon and the
          # heartbeat job push to the same branch concurrently.
          bash scripts/sync_state.sh
