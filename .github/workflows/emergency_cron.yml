name: Autonomous Heartbeat & Emergency Fallback

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force emergency execution regardless of heartbeat'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  issues: write
  # Required to dispatch a Telegram bot window when the self-chaining
  # sequence is dead.
  actions: write

jobs:
  heartbeat-and-fallback:
    runs-on: ubuntu-latest
    # The heartbeat may dispatch other workflows; two heartbeats at once
    # would double-dispatch the same stale cycle.
    concurrency:
      group: heartbeat
      cancel-in-progress: false
    # Measured 2026-11-03: the orchestrator run took 29m21s against a 30
    # minute limit — a heartbeat that starts two minutes late was cancelled
    # mid-job, and the bot revival and the state sync never ran. The
    # heartbeat is the last line of defence; a slow queue must not be the
    # first thing that kills it.
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Lightweight Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml requests pydantic httpx

      - name: Run Autonomous Emergency / Heartbeat Orchestrator
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TINYFISH_API_KEYS: ${{ secrets.TINYFISH_API_KEYS }}
          LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If triggered manually, pass --force
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_run }}" = "true" ]; then
            python harness/emergency_runner.py --force
          else
            python harness/emergency_runner.py
          fi

      # Second independent recovery path for the Telegram bot. The bot
      # normally lives in a self-chaining sequence of windows; if that chain
      # ever breaks, this workflow — whose own cron demonstrably fires — is
      # the safety net. It starts a window only when none is running and none
      # is waiting, so it can never race a live bot.
      # `if: always()` — measured 2026-11-03: without it, ANY failure of
      # the orchestrator above removed the bot's second recovery path at
      # exactly the moment the chain was already dead.
      - name: Revive the bot window if the chain is dead
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/revive_bot.sh "${{ github.repository }}" telegram_bot.yml 50

      # The same supervisor, from the second most reliable process. The
      # heartbeat closes the gap the scheduler leaves: a cycle whose artefact
      # is stale is started here, so no cycle depends on a cron slot alone.
      - name: Supervise the cycles the scheduler forgets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python harness/cycle_supervisor.py

      # The third leg: a silence alarm. The daemon writes a health trace and
      # the reviver can start a window, but neither of them can tell the
      # operator that the bot has gone quiet. This step judges the silence
      # from two independent signals — the bot's own trace AND whether a
      # window is really running — and mails the measured evidence once per
      # outage, never a flood. `if: always()` so that a broken heartbeat
      # above cannot silence the alarm that watches it.
      - name: Alarm if the Telegram bot is silent
        if: always()
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DISPATCH_RECIPIENT_EMAIL: ${{ secrets.DISPATCH_RECIPIENT_EMAIL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python harness/bot_silence_alarm.py

      - name: Commit & Push Heartbeat (Profile & Workflow Keepalive)
        run: |
          git config --global user.name "vasiliad"
          git config --global user.email "vasiliadi@users.noreply.github.com"
          # `git add` ABORTS the WHOLE command when one pathspec does not
          # match — measured 2026-11-03: `data/.bot_silence_alarm.json` is
          # written ONLY when the alarm actually fires, so on a healthy day
          # the path did not exist, the add aborted, and NONE of the state
          # was staged. The heartbeat's memory (the supervisor's report, the
          # roster, the event log) never reached the repository — and the
          # `|| true` hid it. Each path is added on its own.
          git add active_models.json 2>/dev/null || true
          git add nim_history.log 2>/dev/null || true
          git add config.yaml 2>/dev/null || true
          git add data/.bot_silence_alarm.json 2>/dev/null || true
          git add data/.cycle_supervisor.json 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "chore(heartbeat): autonomous state sync [skip ci]"
            echo "Heartbeat changes committed."
          else
            # Empty commit keeps the repository active so GitHub never
            # auto-disables the scheduled workflows. This replaces the
            # third-party keepalive action, whose repository is blocked by
            # GitHub ("Repository access blocked") and therefore broke every
            # run of this workflow before a single step could execute.
            git commit --allow-empty -m "chore(keepalive): automated repository heartbeat ping [skip ci]"
            echo "Keepalive ping committed."
          fi

          # Shared helper: rebases and retries, because the bot daemon and the
          # diagnostics job push to the same branch concurrently.
          bash scripts/sync_state.sh
