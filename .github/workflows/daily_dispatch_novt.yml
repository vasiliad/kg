name: Daily 12:00 NOVT Email Dispatch

on:
  schedule:
    # 05:00 UTC corresponds to 12:00 PM (noon) Novosibirsk Time (UTC+7)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      health_only:
        description: 'Send only health check (Проверка связи)'
        required: false
        default: 'false'
        type: boolean
      news_only:
        description: 'Send only AI news digest'
        required: false
        default: 'false'
        type: boolean
      force:
        description: 'Send again even if today''s letter was already delivered'
        required: false
        default: 'false'
        type: boolean
      preview:
        description: 'Render the health letter in the cloud and print it — send nothing'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  # Required so the cycle supervisor can dispatch this workflow when the
  # scheduler skips its slot (the 12:00 NOVT report, dispatched by the cycle supervisor).
  actions: write
  # The backup alert channel: a delivery failure opens an Issue, because
  # the letter itself is the channel that just failed.
  issues: write

jobs:
  dispatch-emails:
    runs-on: ubuntu-latest
    # A manual re-run must queue behind the scheduled one, not race it:
    # two dispatches = the operator gets the same letter twice.
    concurrency:
      group: daily-dispatch
      cancel-in-progress: false
    # The digest now reads the source pages and writes every news out in
    # full: measured in the cloud on 2026-11-02, the two model calls took
    # 295s and 478s — 13 minutes in total, close to the old 25-minute
    # limit. Public repositories get free Actions minutes, so the limit is
    # raised rather than the letter being cut short.
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # Pinned contract (requirements-actions.txt): the runtime changes
          # only when a commit changes it, not when a supplier releases.
          pip install -r requirements-actions.txt

      - name: Measure the Actions load of the day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One cheap API call: how many workflow runs happened in the last
          # 24h. The letter's red line uses it as the load signal — a day
          # with twice the usual runs is a day something retried itself.
          SINCE=$(date -u -d '1 day ago' +'%Y-%m-%dT%H:%M:%SZ')
          RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?created=>=${SINCE}&per_page=1" --jq '.total_count' || echo "")
          echo "ACTIONS_RUNS_24H=${RUNS}" >> "$GITHUB_ENV"
          echo "[*] Actions runs in the last 24h: ${RUNS:-unknown}"

      - name: Execute Daily Dispatcher (12:00 NOVT)
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # The wire has three tiers, and all three must be REACHABLE from
          # the cloud: the primary account, the backup account (used once,
          # only when the primary's wire fails), and the archive copy (a
          # mailbox that belongs to neither the operator nor GitHub).
          # Audited 2026-11-04: the code had all three, and NO workflow
          # passed the last two — so the failover and the archive could
          # never activate, however the operator configured them. An empty
          # value simply means «not configured yet»; the tier switches on
          # by itself the moment the secret exists.
          GMAIL_SENDER_2: ${{ secrets.GMAIL_SENDER_2 }}
          GMAIL_APP_PASSWORD_2: ${{ secrets.GMAIL_APP_PASSWORD_2 }}
          ARCHIVE_RECIPIENT_EMAIL: ${{ secrets.ARCHIVE_RECIPIENT_EMAIL }}
          # The search tier of the model executor.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TINYFISH_API_KEYS: ${{ secrets.TINYFISH_API_KEYS }}
          LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
          DISPATCH_RECIPIENT_EMAIL: ${{ secrets.DISPATCH_RECIPIENT_EMAIL }}
          REDACTION_SALT: ${{ secrets.REDACTION_SALT }}
        run: |
          FLAGS=""
          if [ "${{ inputs.preview }}" = "true" ]; then
            # Render the letter IN THE CLOUD and show it — send nothing.
            # The operator's inbox is not a test bench: the daily guard is
            # right to refuse a second letter, and a check that needs a
            # duplicate to prove itself is not a check. This renders the
            # letter exactly as it would be sent, from the same artefacts.
            python harness/daily_dispatcher.py --preview data/health_preview.html
            if ! grep -q "^Почтовые ящики" data/health_preview.txt; then
              echo "FAIL: the mailbox block is NOT in the letter"
              exit 1
            fi
            echo "----- MAILBOX BLOCK (rendered in the cloud, not sent) -----"
            grep -A 3 "^Почтовые ящики" data/health_preview.txt
            exit 0
          fi
          if [ "${{ inputs.health_only }}" = "true" ]; then
            FLAGS="--health-only"
          elif [ "${{ inputs.news_only }}" = "true" ]; then
            FLAGS="--news-only"
          fi
          # The dispatcher keeps the daily promise by itself: a letter that
          # was already delivered today is not sent again. Measured on
          # 2026-11-02: the operator received the same letter four times in
          # one day. Only an explicit --force (the operator's own hand on
          # the trigger) may repeat it.
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi

          python harness/daily_dispatcher.py $FLAGS

      - name: Persist Dispatch Outcome
        run: |
          git config --global user.name "vasiliad"
          git config --global user.email "vasiliadi@users.noreply.github.com"
          # The digest artefact holds the letter's own content, so the bot
          # can quote it later ("что было в утреннем дайджесте?"). It is
          # masked before writing (harness/redaction.py) — the repository is
          # public.
          # `git add` ABORTS the WHOLE command when one pathspec does not
          # match (measured 2026-11-03): one missing file and NOTHING is
          # staged — the cycle's state silently never reached the repo.
          # Each path is added on its own.
          git add nim_history.log 2>/dev/null || true
          git add data/daily_digest.json 2>/dev/null || true
          # The credential heartbeat: the record that shows the wire DECAYING
          # before it dies. Audited 2026-11-04: it was written by two cycles
          # and committed by NEITHER, so the decay history died with the
          # runner and the operator only ever saw the last run's verdict.
          git add data/.credential_heartbeat.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(dispatch): record report dispatch outcome [skip ci]"
            echo "Dispatch outcome committed."
          else
            echo "No dispatch log changes."
          fi

          # Shared helper: rebases and retries, because the bot daemon, the
          # heartbeat and the diagnostics push to the same branch concurrently.
          bash scripts/sync_state.sh
