name: Telegram Bot Daemon (Cloud)

# The bot is a long-polling Telegram client. A hosted runner job cannot live
# forever, so the bot runs in bounded windows — but the windows CHAIN
# themselves: every run dispatches the next one in its final step, so the bot
# stays alive indefinitely without depending on GitHub's cron scheduler.
#
# Why not cron: on 2026-10-31 the `*/30` schedule silently skipped the 17:00Z
# and 17:30Z slots (no run was even created), and the bot was unreachable for
# hours while Telegram kept the operator's messages queued. A chain does not
# care whether the scheduler is punctual — one successful dispatch is enough.
#
# If the chain itself ever breaks, bot_watchdog.yml revives it.
#
# Public repositories get free GitHub-hosted runners (unlimited minutes).

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long the bot should stay alive'
        required: false
        default: '50'
        type: string

permissions:
  contents: write
  # Required to dispatch the next window of this same workflow.
  actions: write

concurrency:
  group: telegram-bot-daemon
  # Never cancel a running bot: the operator's message is being answered.
  # A queued window simply waits its turn instead of racing the live one.
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml requests pydantic httpx

      # The bot arms its own safety net. GitHub's cron scheduler is erratic
      # in this repository — the watchdog's schedule produced no run at all in
      # two hours — so the backup must not depend on it. This tick is asked to
      # check AFTER this window would have ended: if the chain step below
      # handed over to a successor, the tick finds a live bot and does
      # nothing; if the hand-over failed, the tick finds nothing and revives
      # the bot. One tick per window, and it never spawns another tick, so
      # nothing can multiply.
      - name: Arm the watchdog (checks after this window ends)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run bot_watchdog.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            -f delay_minutes=55 \
            || echo "[arm] WARNING: could not arm the watchdog tick; the cron watchdog and the heartbeat still cover this."

      # The cycles that GitHub's scheduler forgets must still come back. The
      # bot window is the most reliable clock in the complex (it chains
      # itself and runs every ~50 minutes), so it also supervises the other
      # cycles: each cycle has an artefact that says when it last ran, and a
      # stale artefact means the cycle is owed a run. Measured on 2026-11-01:
      # the self-test's daily cron produced ZERO scheduled runs in the whole
      # life of the repository.
      - name: Supervise the cycles the scheduler forgets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python harness/cycle_supervisor.py

      - name: Run Bot Daemon (bounded window + state sync)
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes || '50' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_PASSWORD: ${{ secrets.TELEGRAM_BOT_PASSWORD }}
          # The operator's chat id: an ADDRESS. It lives in the secret
          # and nowhere else — the tracked state keeps a fingerprint.
          TELEGRAM_OPERATOR_CHAT_ID: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
          REDACTION_SALT: ${{ secrets.REDACTION_SALT }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TINYFISH_API_KEYS: ${{ secrets.TINYFISH_API_KEYS }}
          LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DISPATCH_RECIPIENT_EMAIL: ${{ secrets.DISPATCH_RECIPIENT_EMAIL }}
        run: bash scripts/run_telegram_daemon.sh

      # `if: always()` — the chain must survive a crashed daemon step too.
      # The queued-window check keeps exactly one chain alive: if the watchdog
      # already queued a window, this run does not add a second one.
      - name: Chain the next window (keeps the bot alive without cron)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="repos/${{ github.repository }}/actions/workflows/telegram_bot.yml/runs"
          for attempt in 1 2 3; do
            queued=$(gh api "$API?status=queued" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "$queued" -ne 0 ]; then
              echo "[chain] a window is already queued — not dispatching a duplicate."
              exit 0
            fi
            if gh workflow run telegram_bot.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
                 -f duration_minutes="${{ inputs.duration_minutes || '50' }}"; then
              echo "[chain] next window dispatched (attempt ${attempt})."
              exit 0
            fi
            echo "[chain] dispatch failed (attempt ${attempt}); retrying in 10s..."
            sleep 10
          done
          echo "[chain] WARNING: could not dispatch the next window — the watchdog will revive the bot."
