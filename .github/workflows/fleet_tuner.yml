name: Autonomous Fleet Tuner

# The complex selects and tunes its own duty models: scans the live NIM
# catalogue, pings candidates, runs objective probes (math / code / JSON),
# sweeps sampling parameters, and commits the measured roster. The config
# seed is only the starting point — the measurement is the verdict.

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours, offset from the heartbeat (0 */6) and the cloud tests
    # (42 */6) so push races stay rare.
    - cron: '23 */6 * * *'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml requests pydantic httpx

      - name: Measure the Live Catalogue and Re-select the Duty Team
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TINYFISH_API_KEYS: ${{ secrets.TINYFISH_API_KEYS }}
        run: python harness/fleet_tuner.py

      - name: Commit & Push Tuned Fleet
        run: |
          git config --global user.name "vasiliad"
          git config --global user.email "vasiliadi@users.noreply.github.com"
          git add active_models.json data/fleet_report.json data/model_sizes.json nim_history.log || true

          if ! git diff --staged --quiet; then
            git commit -m "feat(fleet): measured duty-team re-selection [skip ci]"
            echo "Tuned fleet committed."
          else
            git commit --allow-empty -m "chore(fleet): tuner cycle completed without roster change [skip ci]"
            echo "No roster change; keepalive ping committed."
          fi

          bash scripts/sync_state.sh
