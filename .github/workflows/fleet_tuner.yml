name: Autonomous Fleet Tuner

# The complex selects and tunes its own duty models: scans the live NIM
# catalogue, pings candidates, runs objective probes (math / code / JSON /
# translation / tool call), sweeps sampling parameters, and commits the
# measured roster. The config seed is only the starting point — the
# measurement is the verdict.

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours, offset from the heartbeat (0 */6) and the cloud tests
    # (42 */6) so push races stay rare.
    - cron: '23 */6 * * *'

permissions:
  contents: write
  # Required so the cycle supervisor can dispatch this workflow when the
  # scheduler skips its slot (the fleet measurement, dispatched by the cycle supervisor).
  actions: write

jobs:
  tune:
    runs-on: ubuntu-latest
    # Two tuners at once would double-measure the same roster and fight
    # over active_models.json. Queue instead of racing; a 40-minute
    # measurement must not be cancelled halfway.
    concurrency:
      group: fleet-tuner
      cancel-in-progress: false
    # Measured: the tuner takes 9m30s–20m29s per cycle (12 pings + 6 models x
    # 3 quality probes + a parameter sweep). The multilingual and tool-call
    # probes add 12 short calls, so the cap was raised from 25 to 40 minutes
    # to keep the measurement from being cut off mid-flight.
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # Pinned contract (requirements-actions.txt): the runtime changes
          # only when a commit changes it, not when a supplier releases.
          pip install -r requirements-actions.txt

      - name: Measure the Live Catalogue and Re-select the Duty Team
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TINYFISH_API_KEYS: ${{ secrets.TINYFISH_API_KEYS }}
          LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
        run: python harness/fleet_tuner.py

      - name: Commit & Push Tuned Fleet
        run: |
          git config --global user.name "vasiliad"
          git config --global user.email "vasiliadi@users.noreply.github.com"
          # `git add` ABORTS the WHOLE command when one pathspec does not
          # match (measured 2026-11-03): one missing file and NOTHING is
          # staged — the cycle's state silently never reached the repo.
          # Each path is added on its own.
          git add active_models.json 2>/dev/null || true
          git add data/fleet_report.json 2>/dev/null || true
          git add data/fleet_history.json 2>/dev/null || true
          git add data/model_sizes.json 2>/dev/null || true
          git add nim_history.log 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "feat(fleet): measured duty-team re-selection [skip ci]"
            echo "Tuned fleet committed."
          else
            git commit --allow-empty -m "chore(fleet): tuner cycle completed without roster change [skip ci]"
            echo "No roster change; keepalive ping committed."
          fi

          bash scripts/sync_state.sh
