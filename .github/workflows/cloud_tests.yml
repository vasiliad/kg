name: Cloud Verification Suite

# Runs the five-suite autonomous verification from inside the cloud runtime,
# where the provider APIs are actually reachable. A failure here is a visible,
# automated signal that a supplier changed something the complex depends on.

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours, offset from the heartbeat and diagnostics slots.
    - cron: '42 */6 * * *'

permissions:
  contents: write
  # Required so the cycle supervisor can dispatch this workflow when the
  # scheduler skips its slot (the verification suite, dispatched by the cycle supervisor).
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    # Two verification suites at once would double-hit the measured
    # providers and flake each other's live assertions.
    concurrency:
      group: cloud-tests
      cancel-in-progress: false
    # The live digest build inside the resilience suite measures ~17 minutes
    # in Actions (the model writes every news out in full), and the forge's
    # gate adds an OFFLINE run of the whole suite on top of it. Measured
    # 2026-11-03: the previous 20-minute limit killed the run at 20m22s.
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml requests pydantic httpx

      - name: Run Verification Suite
        id: verify
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TINYFISH_API_KEYS: ${{ secrets.TINYFISH_API_KEYS }}
          LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_PASSWORD: ${{ secrets.TELEGRAM_BOT_PASSWORD }}
          DISPATCH_RECIPIENT_EMAIL: ${{ secrets.DISPATCH_RECIPIENT_EMAIL }}
          # The sovereign neural tier downloads multiple GB; the deterministic
          # kernel is the fast, dependency-free path exercised in CI.
          SOVEREIGN_FORCE_DETERMINISTIC: '1'
        run: |
          set +e
          echo "=== Resilience & Honesty stress suite (offline) ==="
          python tests/test_resilience_suite.py
          OFFLINE=$?
          echo "=== Eternal memory & runtime suite (live providers) ==="
          python tests/test_eternal_memory_suite.py
          MEMORY=$?
          # The report is written even when a suite FAILED — a failed
          # verification is exactly the evidence the operator must see.
          python harness/verification_report.py --offline "$OFFLINE" --memory "$MEMORY" || true
          if [ "$OFFLINE" -ne 0 ] || [ "$MEMORY" -ne 0 ]; then
            echo "::error::the verification suite did not pass"
            exit 1
          fi

      # The proof of life. Without an artefact the cycle supervisor had
      # nothing to watch, and this — the very check meant to notice that a
      # supplier changed something — was the one cycle the scheduler could
      # silently drop for weeks.
      - name: Commit the verification report
        if: always()
        run: |
          git config --global user.name "vasiliad"
          git config --global user.email "vasiliadi@users.noreply.github.com"
          git add data/cloud_tests_report.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(cloud): the verification suite's own report [skip ci]"
          fi
          bash scripts/sync_state.sh
