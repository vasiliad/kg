name: Bot Watchdog

# Safety net for the Telegram bot.
#
# The bot normally lives in a self-chaining sequence of windows
# (telegram_bot.yml dispatches its own successor). That chain is
# self-sustaining, but if a link dies the bot would stay silent until a human
# noticed. This watchdog revives it.
#
# It dispatches a new window ONLY when no bot window is running and none is
# waiting — so it can never create a second chain next to a live one.
#
# The schedule is deliberately dense (every 20 minutes) and deliberately
# off-round: GitHub's cron scheduler skips slots under load, and on
# 2026-10-31 it skipped the bot's `*/30` slots entirely. A dense, odd-minute
# schedule survives that far better than a round one.
#
# One cron entry per minute value, exactly like every other scheduled
# workflow in this repository: the comma-list form `7,20,33,46,59` was tried
# first and produced no scheduled run at all in the first hour.

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '27 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      delay_minutes:
        description: 'Wait this many minutes before checking the chain'
        required: false
        default: '0'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  # Ticks with the same delay queue behind each other; an armed tick (which
  # sleeps for most of an hour) must not starve the immediate cron ticks.
  group: bot-watchdog-${{ inputs.delay_minutes || '0' }}
  # Overlapping ticks must queue, not run side by side: two revivers must
  # never race and start two bot windows.
  cancel-in-progress: false

jobs:
  revive:
    runs-on: ubuntu-latest
    # Must cover the longest delay anyone may ask for.
    timeout-minutes: 65
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The bot arms this watchdog at the START of its window and asks it to
      # check AFTER the window is over. A tick that checked immediately would
      # always see a live bot and learn nothing; a tick that checks after the
      # window ends sees exactly the situation it exists for — a chain that
      # did not hand over to a successor.
      - name: Wait before checking the chain
        run: |
          delay="${{ inputs.delay_minutes || '0' }}"
          if [ "$delay" -gt 0 ] 2>/dev/null; then
            echo "[watchdog] waiting ${delay} minutes before checking the chain..."
            sleep $((delay * 60))
          fi

      - name: Revive the bot window if the chain is dead
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/revive_bot.sh "${{ github.repository }}" telegram_bot.yml 50
