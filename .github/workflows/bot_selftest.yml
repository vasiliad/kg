name: Bot Self-Test Conversation

# The complex interrogates its own Telegram bot through the REAL message
# processing path (password gate -> keeper dispatch -> duty calls -> reply
# composition), with only the Telegram transport stubbed. The transcript is
# committed so the operator can read exactly how the bot answered.

on:
  workflow_dispatch:
  schedule:
    # Daily, offset from the other cycles.
    - cron: '52 3 * * *'

permissions:
  contents: write
  # Required so the cycle supervisor can dispatch this workflow when the
  # scheduler skips its slot (the handler battery, dispatched by the cycle supervisor).
  actions: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    # The battery talks to the live bot transport; two runs would race for
    # the same Telegram cursor.
    concurrency:
      group: bot-selftest
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # Pinned contract (requirements-actions.txt): the runtime changes
          # only when a commit changes it, not when a supplier releases.
          pip install -r requirements-actions.txt

      - name: Run the Conversation Battery
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TINYFISH_API_KEYS: ${{ secrets.TINYFISH_API_KEYS }}
          LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_PASSWORD: ${{ secrets.TELEGRAM_BOT_PASSWORD }}
          TELEGRAM_OPERATOR_CHAT_ID: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
          REDACTION_SALT: ${{ secrets.REDACTION_SALT }}
          DISPATCH_RECIPIENT_EMAIL: ${{ secrets.DISPATCH_RECIPIENT_EMAIL }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # The wire's other two tiers (audited 2026-11-04: implemented in
          # the sender, wired into NO workflow — so they could never fire).
          GMAIL_SENDER_2: ${{ secrets.GMAIL_SENDER_2 }}
          GMAIL_APP_PASSWORD_2: ${{ secrets.GMAIL_APP_PASSWORD_2 }}
          ARCHIVE_RECIPIENT_EMAIL: ${{ secrets.ARCHIVE_RECIPIENT_EMAIL }}
          SOVEREIGN_FORCE_DETERMINISTIC: '1'
        run: python harness/bot_selftest.py

      - name: Run the Telegram Transport Test (real delivery to the operator chat)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_PASSWORD: ${{ secrets.TELEGRAM_BOT_PASSWORD }}
          TELEGRAM_OPERATOR_CHAT_ID: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
          REDACTION_SALT: ${{ secrets.REDACTION_SALT }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python harness/bot_transport_test.py

      # The fourth leg: the live web itself. On 2026-11-01 the operator asked
      # for a company and its price and the bot answered from memory — the
      # planner never asked the web. This proves the planner asks, that a real
      # tier answers in the operator's language, and that the duty model's own
      # answer is built on those live facts. Nothing is sent to Telegram.
      - name: Prove the live web is reachable and the planner asks for it
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TINYFISH_API_KEYS: ${{ secrets.TINYFISH_API_KEYS }}
          LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
        run: python harness/search_probe.py --answer

      # The silence alarm is the third leg of the bot's survival: if the
      # chain dies, somebody has to be told. This proves the alarm is armed
      # — a synthetic outage must produce the alarm verdict, and a recipient
      # must be resolvable — without mailing anyone.
      - name: Verify the silence alarm is armed (no mail is sent)
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DISPATCH_RECIPIENT_EMAIL: ${{ secrets.DISPATCH_RECIPIENT_EMAIL }}
        run: python harness/bot_silence_alarm.py --selftest

      - name: Commit & Push the Transcript
        if: always()
        run: |
          git config --global user.name "vasiliad"
          git config --global user.email "vasiliadi@users.noreply.github.com"
          # `git add` ABORTS the WHOLE command when one pathspec does not
          # match (measured 2026-11-03): one missing file and NOTHING is
          # staged — the cycle's state silently never reached the repo.
          # Each path is added on its own.
          git add data/bot_selftest_report.json 2>/dev/null || true
          git add data/bot_transport_report.json 2>/dev/null || true
          git add nim_history.log 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "test(bot): self-test conversation transcript [skip ci]"
          else
            git commit --allow-empty -m "chore(bot): self-test cycle, no transcript change [skip ci]"
          fi
          bash scripts/sync_state.sh
