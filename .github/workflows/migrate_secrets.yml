name: "One-off: transfer every secret to the new account"
# Одноразовый перенос ВСЕХ секретов из хранилища vasiliad/kg в gviv5me/immortal-bot.
#
# Почему так: значения секретов GitHub не отдаёт, а локальная копия оказалась
# заглушками (VAULT_SALT='salt-from-the-file…', GH_PAT='ghp_xxxx…'). Единственный
# честный источник — живое хранилище секретов старого репозитория, и его
# читает только workflow, запущенный ВНУТРИ этого репозитория.
#
# Правила:
#   * значение НИКОГДА не печатается — идёт stdin → API (GitHub маскирует);
#   * печатаются только ИМЕНА секретов и счётчики;
#   * GVIV5ME_TOKEN не копируется (он и так принадлежит новому аккаунту);
#   * GH_PAT не копируется: старый PAT принадлежит ВАСИЛИАДУ, а комплекс на
#     новом аккаунте обязан работать от имени нового владельца. Его ставит
#     мигратор сразу после переноса — старый PAT на новом репо не оседает;
#   * файл живёт вне репозитория (C:\Projects\migration) и попадает в старый
#     репозиторий только в момент переезда.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GVIV5ME_TOKEN }}
      ALL_SECRETS: ${{ toJSON(secrets) }}
      TARGET_REPO: givi5me/immortal-bot
    steps:
      - name: copy secrets (values never printed)
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GVIV5ME_TOKEN пуст — перенос невозможен"; exit 1
          fi
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(os.environ["ALL_SECRETS"])
          target = os.environ["TARGET_REPO"]
          skip = {"GVIV5ME_TOKEN", "GH_PAT"}
          ok, bad = [], []
          for name, value in sorted(data.items()):
              if name in skip or not value:
                  continue
              p = subprocess.run(
                  ["gh", "secret", "set", name, "--repo", target],
                  input=value, text=True, capture_output=True)
              if p.returncode == 0:
                  ok.append(name)
              else:
                  bad.append(name)
          print("скопировано секретов:", len(ok))
          print("имена:", ", ".join(ok))
          if bad:
              print("НЕ удалось:", ", ".join(bad))
              raise SystemExit(1)
          PY
      - name: verify by name
        run: |
          set -euo pipefail
          echo "секреты на новом репо (только имена):"
          gh secret list --repo "$TARGET_REPO" --json name --jq '.[].name' | sort
